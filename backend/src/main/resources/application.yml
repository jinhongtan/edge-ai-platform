server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/edge_ai}
    username: ${SPRING_DATASOURCE_USERNAME:edge_ai}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_BYTES:104857600}
      max-request-size: ${APP_UPLOAD_MAX_BYTES:104857600}
app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  upload:
    max-bytes: ${APP_UPLOAD_MAX_BYTES:104857600}
    storage-dir: ${APP_UPLOAD_STORAGE_DIR:${java.io.tmpdir}/edge-ai-platform-models}
  worker:
    python: ${APP_WORKER_PYTHON:python}
    timeout-seconds: ${APP_WORKER_TIMEOUT_SECONDS:30}
    working-directory: ${APP_WORKER_WORKING_DIRECTORY:}
