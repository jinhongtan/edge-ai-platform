[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ai-model-worker"
version = "0.1.0"
description = "Safe ONNX validation and metadata inspection library"
requires-python = ">=3.12"
dependencies = ["onnx==1.20.0", "onnxruntime==1.24.1"]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
onnx-worker = "onnx_worker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
